name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The file's details (shown under its name in Conveta), the format and settings you chose, or the link for a download.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Conveta and macOS version
      placeholder: Conveta 1.0.0, macOS 26.1, Apple M3
    validations:
      required: true
