name: Release

# Push a tag like v1.2.0 to publish a signed, notarized release with an update for Sparkle.
# Secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID (scripts/setup-release-secrets.sh) and SPARKLE_PRIVATE_KEY
# (scripts/setup-update-key.sh). See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools
        run: brew install xcodegen nasm cmake pkgconf meson ninja autoconf automake

      - name: FFmpeg helper (cached)
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            Vendor/FFmpeg/bin
            Vendor/FFmpeg/BUILDINFO.txt
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh', 'Vendor/FFmpeg/sources.sha256') }}

      - name: Build FFmpeg helper
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      - name: Check the secrets are there
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$CERTIFICATE" ] || missing="$missing APPLE_CERTIFICATE (scripts/setup-release-secrets.sh)"
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID (scripts/setup-release-secrets.sh)"
          [ -n "$SPARKLE_PRIVATE_KEY" ] || missing="$missing SPARKLE_PRIVATE_KEY (scripts/setup-update-key.sh)"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - name: Signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$PASSWORD" $KEYCHAIN
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/certificate.p12

      - name: Update key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          (umask 077; printf %s "$SPARKLE_PRIVATE_KEY" > $RUNNER_TEMP/sparkle.key)
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz | tar -xJ -C $RUNNER_TEMP

      - name: Build, sign, notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
          SPARKLE_BIN: ${{ runner.temp }}/bin
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/release/Conveta-$VERSION.dmg" build/release/appcast.xml \
            --title "Conveta $VERSION" --generate-notes

      - name: Clean up secrets
        if: always()
        run: |
          rm -f $RUNNER_TEMP/sparkle.key
          security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true
